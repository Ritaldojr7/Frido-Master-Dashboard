# Deploy Frido Master Dashboard to GitHub Pages
# Builds the frontend in demo mode (no backend required)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Main App
        env:
          VITE_DEMO_MODE: 'true'
          GITHUB_PAGES: 'true'
          VITE_APP_TYPE: 'ADMIN'
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          rm -f .env*
          npm run build

      - name: Create build structure
        run: |
          mkdir -p final-dist
          cp -r dist/. final-dist/

      - name: Build Staff App 
        env:
          VITE_DEMO_MODE: 'true'
          GITHUB_PAGES: 'true'
          VITE_APP_TYPE: 'STAFF'
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          rm -f .env*
          npm run build

      - name: Merge builds
        run: |
          mkdir -p final-dist/staff
          cp -r dist/. final-dist/staff/
          cp final-dist/index.html final-dist/404.html
          cp final-dist/staff/index.html final-dist/staff/404.html
          touch final-dist/.nojekyll
          rm -rf dist
          mv final-dist dist

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
