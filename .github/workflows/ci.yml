# ─────────────────────────────────────────────────────────
# CI + CD — quality gates on push/PR; deploy to Render after green tests on main
# ─────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR builds only — never abort in-progress main deploys (duplicate merge
# webhooks can otherwise cancel Build before Deploy to Render runs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  # CD: Render auto-deploy can stay off; this fires only after quality passes on main.
  deploy:
    name: Deploy to Render
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -e
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing. Render → your web service → Settings → Deploy Hook → create hook; paste the full URL into GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Render deploy triggered successfully."
          elif [ "$HTTP_CODE" -eq 409 ]; then
            echo "A Render deployment is already in progress (HTTP 409 Conflict). Skipping duplicate trigger."
          else
            echo "::error::Render deploy hook failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
