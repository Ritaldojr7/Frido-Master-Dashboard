# Render Blueprint — $0 web tier; Postgres via Supabase (set DATABASE_URL in Render UI).
# Create a Supabase project → Settings → Database → copy URI connection string.
#
# One-time data copy from local SQLite: npm run migrate:supabase (with DATABASE_URL set).
#
# For managed Postgres on Render instead, use a `databases:` block + paid web plan (see Render docs).
services:
  - type: web
    name: frido-master-dashboard
    env: node
    plan: free
    # NODE_ENV=production skips devDependencies — Vite would be missing (exit 127).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # CLERK_SECRET_KEY + VITE_CLERK_PUBLISHABLE_KEY must be the SAME Clerk application (dev vs prod keys match).
      # VITE_* is inlined at npm run build — set both before deploy or the SPA hangs on loading / seed fails with Unauthorized.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      # External Postgres (Neon / Supabase / etc.) — required for this free-tier layout
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        value: myfrido.com
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_INVITE_SENDER
        sync: false
      # GitHub dispatch for dashboard "Edit with Claude" feature
      - key: GH_REPO
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: IST_EDIT_PASS
        sync: false
      - key: EXEC_EDIT_PASS
        sync: false
