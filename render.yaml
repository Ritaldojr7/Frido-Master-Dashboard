services:
  - type: web
    name: frido-master-dashboard
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Clerk — required at runtime for API token verification & invites
      - key: CLERK_SECRET_KEY
        sync: false
      # Clerk — must be available during `npm run build` (Vite inlines VITE_* into the bundle)
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Used for invite redirect URLs and transactional email links (your Render web URL)
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      # Seed runs once: creates this Clerk user + SQLite row if missing (never commit real passwords)
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: frido-master-dashboard-db
          property: connectionString
      - key: ALLOWED_EMAIL_DOMAINS
        value: myfrido.com
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_INVITE_SENDER
        sync: false

databases:
  # Legacy Postgres plan names like `starter` are rejected for new DBs (Oct 2024+ flexible plans).
  - name: frido-master-dashboard-db
    plan: basic-256mb
