# Render Blueprint — $0 on Render for the web service (free tier spins down when idle).
# Postgres: Render no longer offers free managed Postgres for new DBs. Use a free external
# Postgres (Neon, Supabase, etc.) and paste DATABASE_URL in the Render dashboard when prompted.
#
# For always-on + managed DB on Render, change web `plan` to `starter` (or higher) and add a
# `databases:` block with e.g. `plan: basic-256mb`, wiring DATABASE_URL via `fromDatabase`.
services:
  - type: web
    name: frido-master-dashboard
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      # External Postgres (Neon / Supabase / etc.) — required for this free-tier layout
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        value: myfrido.com
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_INVITE_SENDER
        sync: false
