<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frido IST · Performance &amp; Profitability Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{
  --ink:#14202E; --ink-2:#1C2C3D; --paper:#EDF1F2; --card:#FFFFFF;
  --teal:#0E9E96; --teal-deep:#0A6E69; --teal-wash:#E2F2F0;
  --green:#1F8A54; --amber:#DA9000; --red:#CB3B4A;
  --green-wash:#E4F3EA; --amber-wash:#FBF0D6; --red-wash:#FAE3E5;
  --line:#DCE4E6; --line-2:#EAEFF0; --muted:#5E7178; --muted-2:#8A9AA0;
  --shadow:0 1px 2px rgba(20,32,46,.04),0 4px 16px rgba(20,32,46,.06);
  --shadow-lg:0 8px 30px rgba(20,32,46,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv05" 1;
}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:"Space Grotesk","Inter",sans-serif}
button{font-family:inherit}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:236px;flex:0 0 236px;background:var(--ink);color:#fff;
  padding:22px 16px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand .mark{width:34px;height:34px;flex:0 0 34px;position:relative}
.brand .wm{font-family:"Space Grotesk";font-weight:700;font-size:16px;letter-spacing:.2px;line-height:1.05}
.brand .wm small{display:block;font-family:"Inter";font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-top:3px}
.navlbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);padding:14px 10px 6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:0;color:#AEBCC4;padding:10px 11px;border-radius:9px;
  font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;
}
.nav button .ic{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.active{background:var(--teal);color:#fff;box-shadow:0 4px 14px rgba(14,158,150,.35)}
.nav button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.rail .foot{margin-top:auto;font-size:10.5px;color:var(--muted-2);padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- topbar / filters ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(237,241,242,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
}
.topbar .vt{margin-right:auto}
.topbar .vt h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.topbar .vt p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-left:2px}
.sel{position:relative}
.sel select{
  appearance:none;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:8px 30px 8px 12px;font-size:13px;color:var(--ink);font-weight:500;cursor:pointer;
  min-width:148px;transition:border-color .15s,box-shadow .15s;
}
.sel select:hover{border-color:#C2CFD2}
.sel select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-wash)}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-65%) rotate(45deg);pointer-events:none}
.reset{
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;
  font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;height:36px;transition:.15s;
}
.reset:hover{border-color:var(--red);color:var(--red)}
.reset:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.scope{padding:9px 26px;font-size:12px;color:var(--muted);background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-wash);color:var(--teal-deep);border-radius:20px;padding:3px 11px;font-weight:600;font-size:11.5px}
.chip b{font-weight:700}

.view{padding:0;width:100%;max-width:none}
.view[hidden]{display:none}

/* ---------- hero (overview) ---------- */
.hero{
  background:linear-gradient(135deg,var(--ink) 0%,#1B3346 60%,#0E5752 130%);
  color:#fff;border-radius:18px;padding:26px 28px;margin-bottom:22px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.hero .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7FD8D1;font-weight:600;margin-bottom:10px}
.hero h1{margin:0;font-size:clamp(26px,3vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1.08}
.hero h1 .big{color:#5BE0D6}
.hero p.sub{margin:10px 0 20px;color:#B9CAD2;font-size:13.5px;max-width:60ch}
/* the signature: load-bar */
.loadbar-wrap{margin-top:6px}
.loadbar-scale{display:flex;justify-content:space-between;font-size:10.5px;color:#8FA6B0;margin-bottom:6px;letter-spacing:.04em}
.loadbar{position:relative;height:30px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden}
.loadbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal) 0%,#46D6C9 100%);border-radius:8px 0 0 8px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.loadbar .fill span{font-family:"Space Grotesk";font-weight:700;font-size:13px;color:var(--ink)}
.loadbar .be{position:absolute;top:-3px;bottom:-3px;width:2px;background:#FFD36B}
.loadbar .be::after{content:"break-even 1×";position:absolute;top:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9.5px;color:#FFD36B;letter-spacing:.04em}
.hero .ssc{position:absolute;right:-40px;bottom:-60px;width:230px;height:230px;opacity:.12;pointer-events:none}

/* ---------- kpi grid ---------- */
.sec-h{display:flex;align-items:baseline;gap:10px;margin:24px 2px 13px}
.sec-h h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h .hint{font-size:11.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 15px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-lbl{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.kpi .k-val{font-family:"Space Grotesk";font-size:23px;font-weight:600;margin-top:8px;letter-spacing:-.01em;line-height:1}
.kpi .k-sub{font-size:11px;color:var(--muted-2);margin-top:6px}
.kpi .tick{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal)}
.kpi.g .tick{background:var(--green)} .kpi.a .tick{background:var(--amber)} .kpi.r .tick{background:var(--red)}

/* ---------- chart cards ---------- */
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:6px}
.grid2.even{grid-template-columns:1fr 1fr}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:var(--shadow)}
.panel h4{margin:0 0 3px;font-size:14px;font-weight:600}
.panel .p-sub{margin:0 0 14px;font-size:11.5px;color:var(--muted)}
.chart-box{position:relative;width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- tables ---------- */
.tbl-tools{display:flex;gap:12px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
.search{position:relative;flex:0 0 260px;max-width:100%}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 33px;font-size:13px;background:var(--card)}
.search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-wash)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.tbl-meta{font-size:12px;color:var(--muted);margin-left:auto}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:920px}
thead th{
  position:sticky;top:0;background:var(--ink);color:#fff;font-weight:600;font-size:11px;
  text-align:right;padding:11px 12px;white-space:nowrap;cursor:pointer;user-select:none;z-index:2;
}
thead th.l{text-align:left} thead th.c{text-align:center}
thead th:hover{background:var(--ink-2)}
thead th .ar{opacity:.45;font-size:9px;margin-left:3px}
thead th.sorted .ar{opacity:1;color:#5BE0D6}
tbody td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody td.l{text-align:left} tbody td.c{text-align:center}
tbody tr:hover{background:#F6FAFA}
tbody tr:last-child td{border-bottom:0}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;background:var(--line-2);font-weight:600;font-size:11px;color:var(--muted)}
.rk.top{background:var(--teal);color:#fff}
.agent{font-weight:600;color:var(--ink)}
.eid{font-size:10.5px;color:var(--muted-2);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.green{background:var(--green-wash);color:var(--green)} .pill.amber{background:var(--amber-wash);color:#9A6B00} .pill.red{background:var(--red-wash);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%}
.dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)}
.cell-heat{position:relative;z-index:0}
.cell-heat .bar{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;z-index:-1;opacity:.5}

/* mini load-bar inside salary table */
.mini-load{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.mini-load .track{position:relative;width:90px;height:13px;background:var(--line-2);border-radius:7px;overflow:hidden}
.mini-load .track .f{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.mini-load .track .b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.mini-load .num{font-variant-numeric:tabular-nums;font-weight:600;min-width:42px;text-align:right}

/* quadrant cards */
.quad{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.qc{border-radius:13px;padding:15px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.qc .q-em{font-size:21px} .qc .q-n{font-family:"Space Grotesk";font-size:28px;font-weight:700;margin-top:4px;line-height:1}
.qc .q-t{font-size:12px;font-weight:600;margin-top:3px} .qc .q-d{font-size:11px;opacity:.85;margin-top:3px;line-height:1.35}
.qc.ideal{background:linear-gradient(135deg,#1F8A54,#27A866)}
.qc.rocket{background:linear-gradient(135deg,#0E9E96,#19BFB4)}
.qc.turtle{background:linear-gradient(135deg,#DA9000,#E8A92E)}
.qc.warn{background:linear-gradient(135deg,#CB3B4A,#D9606C)}

/* questions answered strip */
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.qa .q{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
.qa .q .qq{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.qa .q .qaText{font-size:13px;color:var(--ink)}
.qa .q .qaText b{color:var(--teal-deep);font-family:"Space Grotesk"}

.note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.55;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.note b{color:var(--ink)}

footer.appfoot{padding:18px 26px 30px;color:var(--muted-2);font-size:11px;border-top:1px solid var(--line);margin-top:10px}

/* mobile */
.hamb{display:none}
@media(max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid2.even{grid-template-columns:1fr}
  .quad{grid-template-columns:repeat(2,1fr)}
  .qa{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s}
  .rail.open{transform:translateX(0)}
  .hamb{display:inline-flex;align-items:center;justify-content:center;width:38px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:9px;cursor:pointer;margin-right:4px}
  .hamb svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2}
  .topbar .vt h2{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>
/* ---- enhancement-layer styles (additive; inherits existing tokens) ---- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;line-height:1.3;white-space:nowrap}
.pill.gp{background:var(--green-wash);color:var(--green)}.pill.ap{background:var(--amber-wash);color:#9a6500}.pill.rp{background:var(--red-wash);color:var(--red)}.pill.np{background:var(--teal-wash);color:var(--teal-deep)}.pill.gy{background:#EEF2F3;color:var(--muted)}
.grade{font-family:"Space Grotesk";font-weight:700;width:34px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-size:13px}
.grade.Ap{background:#0A6E69;color:#fff}.grade.A{background:var(--teal);color:#fff}.grade.Bp{background:#5FBDB5;color:#073b38}.grade.B{background:var(--teal-wash);color:var(--teal-deep)}.grade.C{background:var(--amber-wash);color:#9a6500}.grade.D{background:var(--red-wash);color:var(--red)}
.bigscore{font-family:"Space Grotesk";font-weight:700;font-size:40px;line-height:1}
.reasons{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.reasons li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);background:var(--line-2);border-radius:8px;padding:7px 10px}
.reasons li b{font-weight:600}
.reasons li .kv{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.flow .node{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600}
.flow .ar{color:var(--muted-2)}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--card)}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td{padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;font-variant-numeric:tabular-nums}
table.dt tr:hover td{background:var(--line-2)}
.tablewrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.minibar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle}
.minibar>i{display:block;height:100%;background:var(--teal)}
.cfg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.cfg label{flex:1;font-size:13px}.cfg input[type=number]{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;text-align:right}
.cfg input[type=range]{flex:1}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{background:var(--teal-deep)}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sec:hover{background:var(--line-2)}
.note{background:var(--teal-wash);border:1px solid #BfE0DC;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#0A4F4A;line-height:1.5}
.warn{background:var(--amber-wash);border-color:#E8CE8A;color:#7a5200}
.selrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.selrow select,.selrow input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .val{font-family:"Space Grotesk";font-weight:700;font-size:22px;margin-top:4px;letter-spacing:-.01em}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.excluded{opacity:.5}
.tag{font-size:10.5px;color:var(--muted);background:var(--line-2);padding:2px 7px;border-radius:6px;font-weight:600}
.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.subnav button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;font-weight:500}
.subnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>

<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 34 34" width="34" height="34"><rect width="34" height="34" rx="9" fill="#0E9E96"/><path d="M9 23V11h10M9 17h8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></div>
      <div class="wm">Frido IST<small>Performance Console</small></div>
    </div>
    <div class="navlbl">Evaluation</div>
    <div class="nav" id="nav">
      <button data-view="overview" class="active"><svg class="ic" viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V3h-8zM3 21h8v-6H3z"/></svg> Executive Summary</button>
      <button data-view="eval"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/></svg> Agent Evaluation</button>
      <button data-view="scorecard"><svg class="ic" viewBox="0 0 24 24"><path d="M3 5h18M3 10h18M3 15h18M3 20h18"/></svg> Agent Scorecard</button>
      <button data-view="recs"><svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg> HR Recommendations</button>
    </div>

<script>
/* ============================== CONFIG ============================== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRYELSTwQWU1-7bYO5yV1wfA-W5QyTQ2A2KVBpcD0JfUc0SLMPxj4UpP0TmEaNamzPdtmYm5eSTVLFp/pub?gid=0&single=true&output=csv";
const COL={ink:'#14202E',teal:'#0E9E96',tealL:'#46D6C9',green:'#1F8A54',amber:'#DA9000',red:'#CB3B4A',line:'#DCE4E6',muted:'#5E7178'};
const COLMAP={
  id:['employee id','emp id','employeeid','id'], name:['row labels','agent name','agent','name'],
  vert:['vertical','vert'], mon:['month','month label','mon'],
  gs:['sum of gross sales (ex gst)','gross sales','gs'], vwd:['sum of value without discount','value without discount','vwd'],
  ns:['sum of taxable value','net sales','taxable value','ns'],
  gi:['sum of gross incentive','gross incentive','gi'], lb:['sum of load bearing','load bearing','lb'],
  ni:['sum of net incentive','net incentive','ni'], nip:['net incentive payable','nip'],
  sal:['gross salary','salary','sal'], mg:['monthly gross','mg'], att:['attendance','attendance days','att'],
  rr:['return rate','rr'], disc:['discount %','discount','disc'], cod:['cod %','cod'],
  pre:['prepaid %','prepaid','pre'], pcod:['partial cod %','partial cod','pcod'],
  p_cush:['cushions','p_cush'], p_chair:['ergonomic chair','p_chair'], p_ins:['insoles','p_ins'],
  p_matt:['mattress','p_matt'], p_orth:['orthotics','p_orth'], p_foot:['footwear','p_foot']
};
const REQUIRED=['id','name','vert','mon','ns','sal','ni','nip','att'];
const CATS=[['p_cush','Cushions'],['p_chair','Ergonomic Chair'],['p_ins','Insoles'],['p_matt','Mattress'],['p_orth','Orthotics'],['p_foot','Footwear']];
const MO={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const MNAME=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* configurable weights + thresholds (persisted) */
const DEF_W={contrib:25,netroi:20,prod:15,consist:10,expertise:10,discount:8,quality:7,attend:5};
const DEF_G={Ap:85,A:75,Bp:65,B:55,C:40};
const DEF_T={hiSalQ:0.75,loSalQ:0.25,topPct:0.90,hiRoiPct:0.75,botRoiPct:0.10,botScorePct:0.25,zeroStreak:3,discHiPct:0.75,retHiPct:0.75};
let WEIGHTS=load('frido_w',DEF_W), GRADES=load('frido_g',DEF_G), THRESH=load('frido_t',DEF_T);
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?Object.assign({},d,v):Object.assign({},d);}catch(e){return Object.assign({},d);}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ============================== PARSE ============================== */
function _num(v){if(v==null)return 0;let s=String(v).trim();if(s===''||s==='-'||s.indexOf('#')>=0)return 0;s=s.replace(/[\u20B9,%\s()]/g,'');const n=parseFloat(s);return isNaN(n)?0:n;}
function _rate(v){if(v==null)return 0;const hasPct=String(v).indexOf('%')>=0;const n=_num(v);return hasPct?n/100:(Math.abs(n)>1.5?n/100:n);}
function _parseMonth(v){if(v==null)return null;let s=String(v).trim();if(!s)return null;let y=null,m=null;const mm=s.match(/^([A-Za-z]{3,})[\s\-\/.]+(\d{2,4})$/);if(mm){m=MO[mm[1].slice(0,3).toLowerCase()];y=parseInt(mm[2],10);}else{const d=new Date(s);if(!isNaN(d.getTime())){m=d.getMonth();y=d.getFullYear();}}if(m==null||y==null||isNaN(y))return null;if(y<100)y+=2000;return{label:MNAME[m]+' '+y,yr:y,qtr:y+'-Q'+(Math.floor(m/3)+1),idx:y*12+m};}
function _headerIndex(headers){const lower=headers.map(h=>String(h||'').trim().toLowerCase());const idx={};for(const f in COLMAP){for(const n of COLMAP[f]){const i=lower.indexOf(n);if(i>=0){idx[f]=headers[i];break;}}}return idx;}
function csvToRecords(rows,headers){
  const idx=_headerIndex(headers);const missing=REQUIRED.filter(f=>idx[f]==null);
  if(missing.length)return{error:'Sheet missing column(s) for: '+missing.join(', ')+'. Found: '+headers.join(' | ')};
  const g=(row,f)=>idx[f]!=null?row[idx[f]]:undefined;const out=[];
  for(const row of rows){const idv=g(row,'id');if(idv==null||String(idv).trim()==='')continue;
    const mp=_parseMonth(g(row,'mon'));const ni=_num(g(row,'ni'));
    const gsal=_num(g(row,'sal'));const mgv=_num(g(row,'mg')),attv=_num(g(row,'att'));
    const daysInMonth=mp?new Date(mp.yr,(mp.idx%12)+1,0).getDate():30;
    const divisor=30.4;
    const sal=mgv>0?mgv*attv/divisor:gsal; // Salary = Monthly Gross × Attendance ÷ 30.4 (average days); if Monthly Gross absent, fall back to Gross Salary (already attendance-adjusted) to avoid double-proration
    out.push({id:String(idv).trim(),name:String(g(row,'name')!=null?g(row,'name'):idv).trim(),
      vert:(String(g(row,'vert')||'').trim())||'Unknown',mon:mp?mp.label:String(g(row,'mon')||'').trim(),
      yr:mp?mp.yr:null,qtr:mp?mp.qtr:'',midx:mp?mp.idx:0,days:daysInMonth,
      gs:_num(g(row,'gs')),vwd:_num(g(row,'vwd')),ns:_num(g(row,'ns')),gi:_num(g(row,'gi')),lb:_num(g(row,'lb')),
      ni:ni,nip:_num(g(row,'nip')),sal:sal,gsal:gsal,mg:mgv,att:attv,
      rr:_rate(g(row,'rr')),disc:_rate(g(row,'disc')),cod:_rate(g(row,'cod')),pre:_rate(g(row,'pre')),pcod:_rate(g(row,'pcod')),
      p_cush:_num(g(row,'p_cush')),p_chair:_num(g(row,'p_chair')),p_ins:_num(g(row,'p_ins')),p_matt:_num(g(row,'p_matt')),p_orth:_num(g(row,'p_orth')),p_foot:_num(g(row,'p_foot'))});}
  return{records:out};
}

/* ============================== UTILS ============================== */
const N0=v=>(v==null||isNaN(v))?0:v;
const fmtINR=v=>{v=N0(v);const s=v<0?'-':'';v=Math.abs(v);if(v>=1e7)return s+'₹'+(v/1e7).toFixed(2)+' Cr';if(v>=1e5)return s+'₹'+(v/1e5).toFixed(2)+' L';if(v>=1e3)return s+'₹'+(v/1e3).toFixed(1)+'K';return s+'₹'+Math.round(v);};
const fmtFull=v=>'₹'+Math.round(N0(v)).toLocaleString('en-IN');
const salDisp=v=>state.confidential?'•••':fmtINR(v);
const salDispFull=v=>state.confidential?'•••':fmtFull(v);
const fmtPct=v=>(N0(v)*100).toFixed(1)+'%';
const fmtX=v=>N0(v).toFixed(2)+'×';
const uniq=a=>[...new Set(a)];
const sum=(a,f)=>a.reduce((s,x)=>s+N0(f?f(x):x),0);
const mean=a=>a.length?sum(a)/a.length:0;
const median=arr=>{if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const stdev=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(sum(a,x=>(x-m)*(x-m))/(a.length-1));};
const pctile=(arr,p)=>{if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const i=(s.length-1)*p;const lo=Math.floor(i),hi=Math.ceil(i);return lo===hi?s[lo]:s[lo]+(s[hi]-s[lo])*(i-lo);};
function pctRanker(vals){const s=[...vals].sort((a,b)=>a-b);return v=>{if(!s.length)return 0;let c=0;for(const x of s){if(x<=v)c++;}return c/s.length;};}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let RAW=[], monthsOrder=[];
const state={vert:'(All)',month:'(All)',year:'(All)',qtr:'(All)',view:'overview',evalId:null,scatter:'sal_ns',scSort:{k:'ns',dir:-1},scQ:'',confidential:load('frido_conf',{on:true}).on,
  override:load('frido_ov',{}),exclude:load('frido_ex',{})};
function isExcluded(id){return !!state.exclude[id];}
function vertOf(id,fallback){return state.override[id]||fallback;}
/* ============================== ENGINE ============================== */
function rowsInScope(){return RAW.filter(r=>(state.vert==='(All)'||r.vert===state.vert)&&(state.month==='(All)'||r.mon===state.month)&&(state.year==='(All)'||String(r.yr)===state.year)&&(state.qtr==='(All)'||r.qtr===state.qtr));}

function buildAgents(rows){
  // month working-day reference = max attendance any agent logged that month
  const monthWD={};rows.forEach(r=>{monthWD[r.mon]=Math.max(monthWD[r.mon]||0,N0(r.att));});
  const m=new Map();
  rows.forEach(r=>{
    let a=m.get(r.id);
    if(!a){a={id:r.id,name:r.name,baseVert:r.vert,vByNs:{},months:new Set(),
      ns:0,gs:0,vwd:0,gi:0,lb:0,ni:0,nip:0,sal:0,att:0,wd:0,wDisc:0,wRet:0,
      cat:{p_cush:0,p_chair:0,p_ins:0,p_matt:0,p_orth:0,p_foot:0},monthly:{}};m.set(r.id,a);}
    a.ns+=N0(r.ns);a.gs+=N0(r.gs);a.vwd+=N0(r.vwd);a.gi+=N0(r.gi);a.lb+=N0(r.lb);
    a.ni+=N0(r.ni);a.nip+=N0(r.nip);a.wDisc+=N0(r.disc)*N0(r.ns);a.wRet+=N0(r.rr)*N0(r.ns);
    a.vByNs[r.vert]=(a.vByNs[r.vert]||0)+N0(r.ns);a.months.add(r.mon);
    CATS.forEach(([k])=>a.cat[k]+=N0(r[k])*N0(r.ns));
    // salary & attendance are agent-MONTH attributes (repeated across vertical rows) -> dedupe per month
    const yr=Math.floor(r.midx/12),mo=r.midx%12,days=(new Date(yr,mo+1,0).getDate())||30;
    const mm=a.monthly[r.midx]||(a.monthly[r.midx]={ns:0,nip:0,att:0,salRaw:0,days:days,mon:r.mon});
    mm.ns+=N0(r.ns);mm.nip+=N0(r.nip);
    mm.att=Math.max(mm.att,N0(r.att));mm.salRaw=Math.max(mm.salRaw,N0(r.sal));
  });
  let out=[...m.values()];
  out.forEach(a=>{
    a.vert=state.override[a.id]||(Object.entries(a.vByNs).sort((x,y)=>y[1]-x[1])[0]||['Unknown'])[0];
    a.primary=(Object.entries(a.vByNs).sort((x,y)=>y[1]-x[1])[0]||['Unknown'])[0];
    a.nMonths=a.months.size;
    // CONFIDENTIAL attendance-prorated salary (internal only): Σ monthGross × att ÷ daysInMonth
    a.att=0;a.wd=0;a.sal=0;
    Object.values(a.monthly).forEach(mm=>{a.att+=mm.att;a.wd+=(monthWD[mm.mon]||0);a.sal+=mm.salRaw;});
    a.cost=a.sal+a.nip;a.profit=a.ns-a.cost;
    a.salRecov=a.sal>0?a.ns/a.sal:0; a.revAboveSal=a.ns-a.sal; a.costRatio=a.ns>0?a.cost/a.ns:0;
    a.netROI=a.cost>0?a.ns/a.cost:0;a.grossROI=a.sal>0?a.gs/a.sal:0;
    a.attPct=a.wd>0?a.att/a.wd:0;a.leave=Math.max(0,a.wd-a.att);
    a.revWD=a.wd>0?a.ns/a.wd:0;a.revAtt=a.att>0?a.ns/a.att:0;
    a.profitAtt=a.att>0?a.profit/a.att:0;
    a.discPct=a.ns>0?a.wDisc/a.ns:0;a.retPct=a.ns>0?a.wRet/a.ns:0;
    a.discLeak=Math.max(0,a.vwd-a.gs); // ex-GST value foregone to discounts
    a.cov=a.sal>0?a.ni/a.sal:0; // incentive coverage of salary
    a.eligible=a.nip>0; a.salJustified=a.nip>0;
    a.incPctSal=a.sal>0?a.nip/a.sal:0; a.incPctNs=a.ns>0?a.nip/a.ns:0;
    a.costRecovery=a.cost>0?a.ns/a.cost:0;
    // monthly series chronological
    const ser=Object.keys(a.monthly).map(k=>+k).sort((x,y)=>x-y).map(k=>a.monthly[k]);
    a.series=ser; const nsv=ser.map(s=>s.ns);
    a.avgMo=mean(nsv); a.medMo=median(nsv); a.sd=stdev(nsv);
    a.cov_var=a.avgMo>0?a.sd/a.avgMo:0; a.consistency=Math.max(0,1-a.cov_var);
    a.best=ser.length?ser.reduce((p,c)=>c.ns>p.ns?c:p):null; a.worst=ser.length?ser.reduce((p,c)=>c.ns<p.ns?c:p):null;
    a.growth=nsv.length>1&&nsv[0]>0?(nsv[nsv.length-1]-nsv[0])/nsv[0]:0;
    // consecutive zero-incentive streak
    let mx=0,cur=0;ser.forEach(s=>{if(s.nip<=0){cur++;mx=Math.max(mx,cur);}else cur=0;});a.zeroStreak=mx;
    a.zeroMonths=ser.filter(s=>s.nip<=0).length;
    // product expertise: breadth (cats >=5% share) + balance (normalized entropy)
    const tot=CATS.reduce((s,[k])=>s+a.cat[k],0)||1;const shares=CATS.map(([k])=>a.cat[k]/tot);
    a.catShare={};CATS.forEach(([k],i)=>a.catShare[k]=shares[i]);
    const breadth=shares.filter(s=>s>=0.05).length/6;
    const H=-shares.filter(s=>s>0).reduce((s,p)=>s+p*Math.log(p),0);const balance=H/Math.log(6);
    a.expertise=0.5*breadth+0.5*balance;
    a.topCat=CATS.map(([k,n])=>[n,a.catShare[k]]).sort((x,y)=>y[1]-x[1])[0];
    a.weakCat=CATS.map(([k,n])=>[n,a.catShare[k]]).sort((x,y)=>x[1]-y[1])[0];
  });
  // exclude from cohort stats but keep for listing
  const active=out.filter(a=>!isExcluded(a.id));
  // pillar percentiles across ACTIVE cohort
  const R={
    contrib:pctRanker(active.map(a=>a.ns)), netroi:pctRanker(active.map(a=>a.netROI)),
    prod:pctRanker(active.map(a=>a.revAtt)), consist:pctRanker(active.map(a=>a.consistency)),
    expertise:pctRanker(active.map(a=>a.expertise)), discount:pctRanker(active.map(a=>1-a.discPct)),
    quality:pctRanker(active.map(a=>1-a.retPct)), attend:pctRanker(active.map(a=>a.attPct))
  };
  const wsum=Object.values(WEIGHTS).reduce((s,x)=>s+x,0)||1;
  out.forEach(a=>{
    a.p={contrib:R.contrib(a.ns)*100,netroi:R.netroi(a.netROI)*100,prod:R.prod(a.revAtt)*100,
      consist:R.consist(a.consistency)*100,expertise:R.expertise(a.expertise)*100,
      discount:R.discount(1-a.discPct)*100,quality:R.quality(1-a.retPct)*100,attend:R.attend(a.attPct)*100};
    a.score=Object.keys(WEIGHTS).reduce((s,k)=>s+WEIGHTS[k]*a.p[k],0)/wsum;
    a.grade=a.score>=GRADES.Ap?'A+':a.score>=GRADES.A?'A':a.score>=GRADES.Bp?'B+':a.score>=GRADES.B?'B':a.score>=GRADES.C?'C':'D';
  });
  // cohort percentiles for score, roi, salary, discount
  const scoreRank=pctRanker(active.map(a=>a.score)), roiRank=pctRanker(active.map(a=>a.netROI)), groiRank=pctRanker(active.map(a=>a.grossROI)),
        discRank=pctRanker(active.map(a=>a.discPct)), retRank=pctRanker(active.map(a=>a.retPct));
  const monS=active.map(a=>a.sal/Math.max(1,a.nMonths));const salHi=pctile(monS,THRESH.hiSalQ),salLo=pctile(monS,THRESH.loSalQ);
  out.forEach(a=>{
    a.scorePct=scoreRank(a.score);a.roiPct=roiRank(a.netROI);a.groiPct=groiRank(a.grossROI);a.discTopPct=discRank(a.discPct);a.retTopPct=retRank(a.retPct);
    a.monSal=a.sal/Math.max(1,a.nMonths);a.hiSal=a.monSal>=salHi;a.loSal=a.monSal<=salLo;
    a.rec=recommend(a);
  });
  // ranks
  const rankBy=(key,desc=true)=>{const s=[...active].sort((x,y)=>desc?y[key]-x[key]:x[key]-y[key]);s.forEach((a,i)=>a['rank_'+key]=i+1);};
  rankBy('ns');rankBy('netROI');rankBy('grossROI');rankBy('revAtt');rankBy('score');rankBy('consistency');rankBy('expertise');rankBy('attPct');
  out._active=active; out._salHi=salHi; out._salLo=salLo;
  return out;
}

/* ---- recommendation engine: first match wins; each carries traceable reasons ---- */
function recommend(a){
  const T=THRESH, r=(t,tone,reasons)=>({tag:t,tone:tone,reasons:reasons});
  const pc=v=>Math.round(v*100);
  // 1 Termination Review
  if(!a.eligible && a.roiPct<=T.botRoiPct && a.zeroStreak>=T.zeroStreak)
    return r('Termination Review','rp',[
      ['Net payable incentive is ₹0 for the whole period',fmtFull(a.nip)],
      ['Net ROI in bottom decile','P'+pc(a.roiPct)+' · '+fmtX(a.netROI)],
      [a.zeroStreak+' consecutive zero-incentive months','≥'+T.zeroStreak]]);
  // 2 PIP
  if(a.zeroStreak>=T.zeroStreak || (!a.eligible && a.scorePct<=T.botScorePct))
    return r('Performance Improvement Plan','rp',[
      a.zeroStreak>=T.zeroStreak?[a.zeroStreak+' consecutive zero-incentive months','≥'+T.zeroStreak]:['Zero incentive & bottom-quartile score','P'+pc(a.scorePct)],
      ['Net ROI','rank #'+(a.rank_netROI||'–')+' · '+fmtX(a.netROI)],
      ['Performance score',a.score.toFixed(1)+' ('+a.grade+')']]);
  // 3 Critical salary mismatch / review
  if(a.hiSal && (!a.eligible || a.roiPct<=T.botScorePct))
    return r(!a.eligible?'Critical Salary Mismatch':'Salary Revision','rp',[
      ['High salary (top quartile)',fmtFull(a.monSal)+'/mo'],
      a.eligible?['Net ROI below cohort','P'+pc(a.roiPct)+' · '+fmtX(a.netROI)]:['Generates ₹0 net incentive',fmtFull(a.nip)],
      ['Net sales vs cost',fmtINR(a.ns)+' / '+fmtINR(a.cost)]]);
  // 4 Salary revision (underpaid star)
  if(a.loSal && a.roiPct>=T.hiRoiPct)
    return r('Salary Revision Recommended','np',[
      ['Low salary (bottom quartile)',fmtFull(a.monSal)+'/mo'],
      ['High Net ROI','P'+pc(a.roiPct)+' · '+fmtX(a.netROI)],
      ['Net sales generated',fmtINR(a.ns)]]);
  // 5 Promotion
  if(a.scorePct>=T.topPct && a.consistency>=0.6 && a.eligible)
    return r('Promotion Ready','gp',[
      ['Performance score in top decile','P'+pc(a.scorePct)+' · '+a.score.toFixed(1)],
      ['Consistent output (low variance)','CoV '+pc(a.cov_var)+'%'],
      ['Incentive-eligible',fmtFull(a.nip)]]);
  // 6 High performer
  if(a.scorePct>=T.hiRoiPct)
    return r('High Performer','gp',[
      ['Top-quartile performance score','P'+pc(a.scorePct)+' · '+a.score.toFixed(1)],
      ['Net ROI',fmtX(a.netROI)+' (rank #'+(a.rank_netROI||'–')+')'],
      ['Net sales',fmtINR(a.ns)]]);
  // 7 Department / vertical change
  const verts=Object.entries(a.vByNs);
  if(verts.length>1 && a.scorePct<=0.5){
    const perV=verts.map(([v,ns])=>[v,ns]).sort((x,y)=>y[1]-x[1]);
    if(perV[0][0]!==a.primary || (perV[1] && perV[1][1]>perV[0][1]*0.6))
      return r('Department / Vertical Change','ap',[
        ['Below-median score in current mix','P'+pc(a.scorePct)],
        ['Works '+verts.length+' verticals; strongest: '+perV[0][0],fmtINR(perV[0][1])],
        ['Re-test fit in best-performing vertical','review']]);
  }
  // 8 Coaching — targeted: a fixable weakness, ineligibility, or bottom-quartile-but-earning
  if(!a.eligible || a.discTopPct>=T.discHiPct || a.retTopPct>=T.retHiPct || a.scorePct<=T.botScorePct){
    const rs=[];
    if(a.discTopPct>=T.discHiPct)rs.push(['High discount reliance','P'+pc(a.discTopPct)+' · '+fmtPct(a.discPct)]);
    if(a.retTopPct>=T.retHiPct)rs.push(['High return rate',fmtPct(a.retPct)]);
    if(!a.eligible)rs.push(['Below incentive threshold',fmtFull(a.nip)]);
    if(a.scorePct<=T.botScorePct)rs.push(['Bottom-quartile score','P'+pc(a.scorePct)+' · '+a.score.toFixed(1)]);
    rs.push(['Net ROI',fmtX(a.netROI)]);
    return r('Coaching Required','ap',rs.slice(0,3));
  }
  // 9 Retain (default: eligible, solid, no specific flag)
  return r('Retain','np',[
    ['Solid, stable performance',a.score.toFixed(1)+' ('+a.grade+')'],
    ['Incentive-eligible · coverage',fmtX(a.cov)],
    ['Net ROI · consistency',fmtX(a.netROI)+' · CoV '+pc(a.cov_var)+'%']]);
}

/* ---- vertical profitability engine (aggregate; individual salary never exposed) ---- */
function vertProfit(active){
  const m={};
  active.forEach(a=>{const v=a.vert;const o=m[v]||(m[v]={v,ns:0,sal:0,nip:0,gs:0,n:0});o.ns+=a.ns;o.sal+=a.sal;o.nip+=a.nip;o.gs+=a.gs;o.n++;});
  const rows=Object.values(m).map(o=>{o.cost=o.sal+o.nip;o.profit=o.ns-o.cost;o.salPct=o.ns>0?o.sal/o.ns:0;o.incPct=o.ns>0?o.nip/o.ns:0;o.totPct=o.ns>0?o.cost/o.ns:0;o.netROI=o.cost>0?o.ns/o.cost:0;o.salRecov=o.sal>0?o.ns/o.sal:0;return o;}).sort((a,b)=>b.ns-a.ns);
  const T={v:'Total',ns:sum(rows,r=>r.ns),sal:sum(rows,r=>r.sal),nip:sum(rows,r=>r.nip),gs:sum(rows,r=>r.gs),n:sum(rows,r=>r.n)};
  T.cost=T.sal+T.nip;T.profit=T.ns-T.cost;T.salPct=T.ns>0?T.sal/T.ns:0;T.incPct=T.ns>0?T.nip/T.ns:0;T.totPct=T.ns>0?T.cost/T.ns:0;T.netROI=T.cost>0?T.ns/T.cost:0;T.salRecov=T.sal>0?T.ns/T.sal:0;
  return {rows,tot:T};
}
// green(low cost) -> amber -> red(high cost)

  const tot=`<tr style="font-weight:700;background:var(--line-2)"><td>Total</td>`+cols.map(([k])=>`<td style="text-align:right">${(vp.tot[k]*100).toFixed(1)}%</td>`).join('')+`</tr>`;

}

    `<div class="tablewrap"><table class="dt"><thead><tr><th>Agent</th><th>Grade</th><th>Score</th><th>Net ROI</th><th>Net payable</th><th>Recommendation</th><th style="text-align:left">Why (traceable KPIs)</th><th style="text-align:center">Del</th></tr></thead><tbody>${rowsHTML}</tbody></table></div>`;

/* shared sortable table */
function dtable(cols,data,fmt){
  const head='<tr>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'<th style="text-align:center">Del</th></tr>';
  const body=data.map(a=>'<tr>'+cols.map(c=>{const v=a[c[0]];const f=fmt&&fmt[c[0]]?fmt[c[0]](v,a):v;return `<td${c[0]==='name'?'':' style="text-align:right"'}>${c[0]==='name'?`<b style="cursor:pointer;color:var(--teal-deep)" onclick="openEval('${a.id}')">${esc(a.name)}</b>`:f}</td>`;}).join('')+`<td style="text-align:center"><button title="Remove from analysis" onclick="scExclude('${a.id}')" style="border:0;background:transparent;color:var(--red);cursor:pointer;font-size:14px;font-weight:700">✕</button></td>`+'</tr>').join('');
  return `<div class="tablewrap"><table class="dt"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

/* OUTLIERS & CORRELATION */
function iqrOut(active,key){const v=active.map(a=>a[key]);const q1=pctile(v,.25),q3=pctile(v,.75),iqr=q3-q1;const lo=q1-1.5*iqr,hi=q3+1.5*iqr;return active.filter(a=>a[key]<lo||a[key]>hi).map(a=>({a,v:a[key],hi:a[key]>hi}));}
function renderOutliers(rows,agents,active){
  const host=document.getElementById('view-outliers');
  const defs=[['monSal','Salary (avg/mo)'],['netROI','Net ROI'],['ns','Revenue'],['discPct','Discount'],['attPct','Attendance'],['score','Performance']];
  const blocks=defs.map(([k,lab])=>{const o=iqrOut(active,k);return cardEl(lab+' outliers',o.length+' flagged (1.5×IQR)',o.length?`<table class="dt"><tbody>${o.sort((x,y)=>y.v-x.v).map(({a,v,hi})=>`<tr><td><b style="cursor:pointer;color:var(--teal-deep)" onclick="openEval('${a.id}')">${esc(a.name)}</b></td><td style="text-align:right">${k==='netROI'?fmtX(v):k==='discPct'||k==='attPct'?fmtPct(v):k==='score'?v.toFixed(1):fmtINR(v)}</td><td style="text-align:right"><span class="pill ${hi?'gp':'rp'}">${hi?'high':'low'}</span></td></tr>`).join('')}</tbody></table>`:'<div style="color:var(--muted);font-size:12px">None.</div>');}).join('');
  const opts=[['sal_ns','Salary vs Net sales'],['sal_roi','Salary vs Net ROI'],['sal_inc','Salary vs Incentive'],['att_ns','Attendance vs Net sales'],['disc_ns','Discount vs Net sales']];
  host.innerHTML=cardEl('Correlation explorer','',`<div class="selrow"><select id="scatSel">${opts.map(o=>`<option value="${o[0]}" ${o[0]===state.scatter?'selected':''}>${o[1]}</option>`).join('')}</select></div><canvas id="corrScatter" height="120"></canvas>`,'margin-bottom:16px')+`<div class="grid g3">${blocks}</div>`;
  document.getElementById('scatSel').addEventListener('change',e=>{state.scatter=e.target.value;render();});
  const map={sal_ns:[a=>a.monSal,a=>a.ns,'Avg monthly salary','Net sales',fmtINR,fmtINR],sal_roi:[a=>a.monSal,a=>a.netROI,'Avg monthly salary','Net ROI',fmtINR,v=>v.toFixed(1)+'×'],sal_inc:[a=>a.monSal,a=>a.nip,'Avg monthly salary','Incentive',fmtINR,fmtINR],att_ns:[a=>a.attPct*100,a=>a.ns,'Attendance %','Net sales',v=>v+'%',fmtINR],disc_ns:[a=>a.discPct*100,a=>a.ns,'Discount %','Net sales',v=>v+'%',fmtINR]}[state.scatter];
  chart('corrScatter',{type:'scatter',data:{datasets:[{data:active.map(a=>({x:map[0](a),y:map[1](a)})),backgroundColor:'rgba(14,158,150,.5)'}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const a=active[c.dataIndex];return a?a.name:'';}}}},scales:{x:{title:{display:true,text:map[2]},ticks:{callback:map[4]}},y:{title:{display:true,text:map[3]},ticks:{callback:map[5]}}}}});
}
/* ============================== SETTINGS & METHODOLOGY ============================== */
const WLAB={contrib:'Contribution (net sales rank)',netroi:'Net ROI',prod:'Working-day productivity',consist:'Performance consistency',expertise:'Product expertise',discount:'Discount control',quality:'Quality (low returns)',attend:'Attendance'};
const TLAB={hiSalQ:'High-salary cutoff (percentile)',loSalQ:'Low-salary cutoff (percentile)',topPct:'Promotion: score percentile ≥',hiRoiPct:'High-ROI percentile ≥',botRoiPct:'Termination: ROI percentile ≤',botScorePct:'Bottom-score percentile ≤',zeroStreak:'Zero-incentive months for PIP/Termination',discHiPct:'High-discount percentile ≥',retHiPct:'High-return percentile ≥'};
function renderSettings(rows,agents,active){
  const host=document.getElementById('view-settings');
  const wsum=Object.values(WEIGHTS).reduce((s,x)=>s+x,0);
  const wrows=Object.keys(DEF_W).map(k=>`<div class="cfg"><label>${WLAB[k]}</label><input type="number" min="0" max="100" step="1" data-w="${k}" value="${WEIGHTS[k]}"></div>`).join('');
  const grows=Object.keys(DEF_G).map(k=>`<div class="cfg"><label>${k.replace('p','+')} grade · score ≥</label><input type="number" min="0" max="100" step="1" data-g="${k}" value="${GRADES[k]}"></div>`).join('');
  const trows=Object.keys(DEF_T).map(k=>`<div class="cfg"><label>${TLAB[k]}</label><input type="number" step="${k==='zeroStreak'?1:0.05}" data-t="${k}" value="${THRESH[k]}"></div>`).join('');
  const excl=Object.keys(state.exclude);const ov=Object.entries(state.override);
  const confCard=cardEl('Salary methodology','attendance-prorated salary, shown throughout',
    `<div class="note" style="font-size:13px">Salary is calculated as <b>(Monthly Gross × Attendance ÷ 30.4)</b> and is <b>visible across the dashboard</b>. This attendance-prorated salary — not raw Gross Salary — drives every calculation: ROI, cost, profitability, coverage, recovery multiple, and the vertical cost-to-sales matrix.</div>`);
  host.innerHTML=confCard.replace('class="card"','class="card" style="margin-bottom:16px"')+
    `<div class="grid g2" style="margin-bottom:16px">`+
    cardEl('Scorecard weights','must be relative; auto-normalized (now sums to '+wsum+')',wrows+`<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="saveW">Apply weights</button><button class="btn sec" id="resetW">Reset</button></div>`)+
    cardEl('Grade bands','final score thresholds',grows+`<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="saveG">Apply grades</button><button class="btn sec" id="resetG">Reset</button></div>`)+
  `</div>`+
    cardEl('HR decision thresholds','all recommendation rules read these',`<div class="grid g2">${trows}</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="saveT">Apply thresholds</button><button class="btn sec" id="resetT">Reset</button></div>`,'margin-bottom:16px')+
    cardEl('Excluded agents & vertical overrides','raw data is never modified',
      `<div style="font-size:12.5px"><b>Excluded (${excl.length}):</b> ${excl.length?excl.map(id=>{const a=agents.find(x=>x.id===id);return `<span class="tag" style="cursor:pointer" onclick="(function(){delete state.exclude['${id}'];save('frido_ex',state.exclude);render();})()">${a?esc(a.name):id} ✕</span>`;}).join(' '):'none'}</div>
       <div style="font-size:12.5px;margin-top:8px"><b>Vertical overrides (${ov.length}):</b> ${ov.length?ov.map(([id,v])=>{const a=agents.find(x=>x.id===id);return `<span class="tag" style="cursor:pointer" onclick="(function(){delete state.override['${id}'];save('frido_ov',state.override);render();})()">${a?esc(a.name):id} → ${esc(v)} ✕</span>`;}).join(' '):'none'}</div>`,'margin-bottom:16px')+
    cardEl('Methodology & data coverage','what is measured, and what was intentionally excluded',
      `<div style="font-size:12.5px;line-height:1.6;color:var(--ink-2)">
       <p style="margin:0 0 8px"><b>Final score</b> = weighted average of eight percentile-ranked pillars (above), computed within the active cohort. Grades and the recommendation cascade read only these scores and the thresholds above — no subjective input.</p>
       <p style="margin:0 0 6px"><b>Included & computed from your data:</b> net/gross sales, gross→net incentive (with load-bearing deduction), net incentive payable, attendance-prorated salary, attendance days, return rate, discount %, payment mix (COD/prepaid/partial), six product-category revenue shares, and month/vertical — at agent×month×vertical grain.</p>
       <p style="margin:0 0 6px"><b>Intentionally excluded (not present in the source data), to avoid fabricated metrics in HR decisions:</b></p>
       <ul style="margin:0 0 8px 18px;padding:0">
         <li>Order count, units sold, AOV, revenue-per-order, orders-per-day — no order/unit columns exist.</li>
         <li>Target achievement % — no targets in the data.</li>
         <li>Manager, joining date, experience, active-selling vs roster days, hours — not captured.</li>
         <li>Customer quality beyond return rate (repeat/new customers, refunds, complaints, replacements) — not captured.</li>
         <li>Per-category discount / selling price, weekly/daily consistency — granularity not available.</li>
       </ul>
       <p style="margin:0"><b>Working days</b> is a proxy (max attendance logged that month) since true roster days aren't in the data. <b>Salary</b> is computed as <b>(Monthly Gross × Attendance) ÷ 30.4</b> — the attendance-prorated pay — and replaces raw Gross Salary in every calculation (ROI, cost, coverage, cost-ratios). The attendance-prorated salary is shown throughout the dashboard and replaces raw Gross Salary in every calculation. The one agent-month split across two verticals (EMP438, Dec 2025) has salary and attendance de-duplicated so it isn't double-counted. <b>Salary justification</b> follows your rule: net payable &gt; ₹0 → justified; = ₹0 → requires review.</p>
       </div>`);
  // wire
  const collect=attr=>{const o={};host.querySelectorAll(`[data-${attr}]`).forEach(i=>o[i.dataset[attr==='w'?'w':attr==='g'?'g':'t']]=parseFloat(i.value)||0);return o;};
  document.getElementById('saveW').onclick=()=>{WEIGHTS=collect('w');save('frido_w',WEIGHTS);render();};
  document.getElementById('resetW').onclick=()=>{WEIGHTS=Object.assign({},DEF_W);save('frido_w',WEIGHTS);render();};
  document.getElementById('saveG').onclick=()=>{GRADES=collect('g');save('frido_g',GRADES);render();};
  document.getElementById('resetG').onclick=()=>{GRADES=Object.assign({},DEF_G);save('frido_g',GRADES);render();};
  document.getElementById('saveT').onclick=()=>{THRESH=collect('t');save('frido_t',THRESH);render();};
  document.getElementById('resetT').onclick=()=>{THRESH=Object.assign({},DEF_T);save('frido_t',THRESH);render();};
  
}

/* ============================== AGENT SCORECARD (ranked table) ============================== */
function scSortClick(k){if(state.scSort.k===k)state.scSort.dir*=-1;else state.scSort={k:k,dir:k==='name'?1:-1};render();}
window.scSortClick=scSortClick;
function renderScorecard(rows,agents,active){
  const host=document.getElementById('view-scorecard');
  const cols=[
    ['name','Agent',null,'l'],['nMonths','Mo.',v=>Math.round(v)],['sal','Salary',fmtINR],['salRecov','Salary recov.',fmtX],
    ['ns','Net sales',fmtINR,'heat'],['gi','Gross inc.',fmtINR],['nip','Net inc. pay.',fmtINR],
    ['attPct','Attend.',fmtPct,'green'],['retPct','Return',fmtPct,'red'],['discPct','Discount',fmtPct,'red'],
    ['revWD','Rev/work day',fmtINR],['revAtt','Rev/att day',fmtINR],['profit','Profit contrib.',fmtINR],
    ['netROI','Net ROI',fmtX],['grossROI','Gross ROI',fmtX],
    ['roiPct','Net ROI %ile',v=>'P'+Math.round(v*100)],['groiPct','Gross ROI %ile',v=>'P'+Math.round(v*100)],
    ['grade','Grade',v=>`<span class="grade ${String(v).replace('+','p')}">${v}</span>`]
  ];
  const q=state.scQ.trim().toLowerCase();
  let data=active.filter(a=>!q||a.name.toLowerCase().includes(q)||a.id.toLowerCase().includes(q)||a.vert.toLowerCase().includes(q));
  const k=state.scSort.k,dir=state.scSort.dir;
  data=[...data].sort((a,b)=>k==='name'?dir*a.name.localeCompare(b.name):dir*((a[k]||0)-(b[k]||0)));
  const maxNs=Math.max(1,...active.map(a=>a.ns)),maxRet=Math.max(.0001,...active.map(a=>a.retPct)),maxDisc=Math.max(.0001,...active.map(a=>a.discPct));
  const arrow=key=>state.scSort.k===key?(state.scSort.dir<0?' ▼':' ▲'):'';
  const head='<tr><th style="text-align:center">#</th>'+cols.map(c=>`<th onclick="scSortClick('${c[0]}')" style="${c[3]==='l'?'text-align:left':''}">${c[1]}${arrow(c[0])}</th>`).join('')+'<th style="text-align:center">Del</th></tr>';
  const body=data.map((a,i)=>{
    const cells=cols.map(c=>{
      const raw=a[c[0]];const val=c[2]?c[2](raw,a):raw;
      let style='text-align:right';let inner=val;
      if(c[3]==='l'){style='text-align:left';inner=`<b style="cursor:pointer;color:var(--teal-deep)" onclick="openEval('${a.id}')">${esc(a.name)}</b><div style="font-size:10.5px;color:var(--muted)">${a.id} · ${esc(a.vert)}</div>`;}
      else if(c[3]==='heat'){const f=raw/maxNs;style+=`;background:linear-gradient(90deg, rgba(14,158,150,${(0.10+0.30*f).toFixed(3)}) ${(f*100).toFixed(0)}%, transparent ${(f*100).toFixed(0)}%);font-weight:600`;}
      else if(c[3]==='green'){style+=`;background:rgba(31,138,84,${(0.08+0.30*Math.min(1,raw)).toFixed(3)})`;}
      else if(c[3]==='red'){const m=c[0]==='retPct'?maxRet:maxDisc;style+=`;background:rgba(203,59,74,${(0.05+0.28*Math.min(1,raw/m)).toFixed(3)})`;}
      return `<td style="${style}">${inner}</td>`;
    }).join('');
    return `<tr><td style="text-align:center;color:var(--muted)">${i+1}</td>${cells}<td style="text-align:center"><button title="Remove from analysis" onclick="scExclude('${a.id}')" style="border:0;background:transparent;color:var(--red);cursor:pointer;font-size:14px;font-weight:700">✕</button></td></tr>`;
  }).join('');
  const exIds=Object.keys(state.exclude);
  const exStrip=exIds.length?`<div style="margin-bottom:10px;font-size:12px"><span class="tag">Removed (${exIds.length}):</span> ${exIds.map(id=>{const a=agents.find(x=>x.id===id)||{name:id};return `<span class="tag" style="cursor:pointer" onclick="scExclude('${id}')">${esc(a.name)} ↩ restore</span>`;}).join(' ')}</div>`:'';
  host.innerHTML=
    `<div class="selrow"><input id="scSearch" placeholder="Search agent, ID, or vertical…" value="${esc(state.scQ)}" style="min-width:280px"><span style="margin-left:auto;color:var(--muted);font-size:12px">${data.length} of ${active.length} agents · sorted by ${cols.find(c=>c[0]===k)?cols.find(c=>c[0]===k)[1]:k}</span></div>`+
    exStrip+
    `<div class="note" style="margin-bottom:12px">One row per agent, ranked & tiered within the current filter. Click any column to sort, click a name to open the full evaluation, and use ✕ to remove an agent from all analysis (raw data is never deleted — restore from the strip above or in Settings).</div>`+
    `<div class="tablewrap"><table class="dt">${head}<tbody>${body}</tbody></table></div>`;
  const s=document.getElementById('scSearch');s.addEventListener('input',e=>{state.scQ=e.target.value;const cur=e.target.selectionStart;render();const ns=document.getElementById('scSearch');if(ns){ns.focus();ns.setSelectionRange(cur,cur);}});
}
function scExclude(id){if(isExcluded(id))delete state.exclude[id];else state.exclude[id]=1;save('frido_ex',state.exclude);render();}
window.scExclude=scExclude;window.renderScorecard=renderScorecard;

/* ============================== NAV / BOOT ============================== */
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{
  state.view=b.dataset.view;
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));
  render();
}));
window.openEval=openEval;window.state=state;window.save=save;window.render=render;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootstrap);else bootstrap();
</script>
</body>
</html>
